<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nova senha | Kato's Agenda</title>

  <link
    rel="stylesheet"
    href="../assets/css/global.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/auth.css"
  >

  <!-- Ícone do navegador -->
  <link
    rel="icon"
    type="image/png"
    href="/assets/icons/katos-icon.png"
  >

  <!-- PWA -->
  <link
    rel="manifest"
    href="/manifest.json"
  >

  <meta
    name="theme-color"
    content="#080c13"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Kato's Agenda"
  >

  <link
    rel="apple-touch-icon"
    href="/assets/icons/katos-icon.png"
  >
</head>

<body>

  <div class="auth-shell">

    <aside class="auth-side">

      <a
        class="brand"
        href="../index.html"
      >
        <span class="brand-mark">K</span>
        <span>Kato's Agenda</span>
      </a>

      <div class="auth-copy">

        <span class="kicker">
          Segurança
        </span>

        <h1>
          Crie uma nova senha para sua conta.
        </h1>

        <p>
          Escolha uma nova senha para voltar a acessar sua barbearia.
        </p>

      </div>

      <span class="auth-caption">
        Kato's Agenda
      </span>

    </aside>


    <main class="auth-main">

      <div class="auth-card card">

        <div class="auth-top">

          <span></span>

          <button
            class="theme-toggle"
            data-theme-toggle
            type="button"
            aria-label="Alternar tema"
          ></button>

        </div>


        <h2>
          Definir nova senha
        </h2>

        <p>
          Digite sua nova senha abaixo.
        </p>


        <form
          id="resetPasswordForm"
          class="auth-form"
        >

          <div class="input-group">

            <label for="newPassword">
              Nova senha
            </label>

            <div class="password-wrap">

              <input
                id="newPassword"
                class="input"
                type="password"
                minlength="6"
                autocomplete="new-password"
                placeholder="Digite a nova senha"
                required
              >

              <button
                class="password-toggle"
                type="button"
                data-password-toggle
              >
                Ver
              </button>

            </div>

          </div>


          <div class="input-group">

            <label for="confirmPassword">
              Confirmar senha
            </label>

            <div class="password-wrap">

              <input
                id="confirmPassword"
                class="input"
                type="password"
                minlength="6"
                autocomplete="new-password"
                placeholder="Digite novamente"
                required
              >

              <button
                class="password-toggle"
                type="button"
                data-password-toggle
              >
                Ver
              </button>

            </div>

          </div>


          <div
            id="authMessage"
            class="auth-message"
            hidden
          ></div>


          <button
            id="resetPasswordSubmit"
            class="btn btn-primary full"
            type="submit"
          >
            Salvar nova senha
          </button>

        </form>

      </div>

    </main>

  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>

</body>

</html>
