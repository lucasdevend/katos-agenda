<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Recuperar senha | Kato's Agenda</title>

  <link
    rel="stylesheet"
    href="../assets/css/global.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/auth.css"
  >

  <!-- Ícone do navegador -->
  <link
    rel="icon"
    type="image/png"
    href="/assets/icons/katos-icon.png"
  >

  <!-- PWA -->
  <link
    rel="manifest"
    href="/manifest.json"
  >

  <meta
    name="theme-color"
    content="#080c13"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Kato's Agenda"
  >

  <link
    rel="apple-touch-icon"
    href="/assets/icons/katos-icon.png"
  >
</head>

<body>

  <div class="auth-shell">

    <aside class="auth-side">

      <a
        class="brand"
        href="../index.html"
      >
        <span class="brand-mark">K</span>
        <span>Kato's Agenda</span>
      </a>

      <div class="auth-copy">

        <span class="kicker">
          Recuperação de acesso
        </span>

        <h1>
          Recupere sua conta com segurança.
        </h1>

        <p>
          Informe o e-mail utilizado no cadastro para receber o link de redefinição.
        </p>

      </div>

      <span class="auth-caption">
        Kato's Agenda
      </span>

    </aside>


    <main class="auth-main">

      <div class="auth-card card">

        <div class="auth-top">

          <a
            class="back-link"
            href="login.html"
          >
            Voltar ao login
          </a>

          <button
            class="theme-toggle"
            data-theme-toggle
            type="button"
            aria-label="Alternar tema"
          ></button>

        </div>


        <h2>
          Esqueceu sua senha?
        </h2>

        <p>
          Digite seu e-mail e enviaremos um link para criar uma nova senha.
        </p>


        <form
          id="forgotPasswordForm"
          class="auth-form"
        >

          <div class="input-group">

            <label for="recoveryEmail">
              E-mail
            </label>

            <input
              id="recoveryEmail"
              class="input"
              type="email"
              autocomplete="email"
              placeholder="voce@barbearia.com"
              required
            >

          </div>


          <div
            id="authMessage"
            class="auth-message"
            hidden
          ></div>


          <button
            id="recoverySubmit"
            class="btn btn-primary full"
            type="submit"
          >
            Enviar link de recuperação
          </button>

        </form>

      </div>

    </main>

  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/pwa.js"></script>

</body>

</html>
